name: Build extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    # a build gets DuckDB (downloaded for a released version, compiled for anything else) and then builds
    # this extension for up to eight platforms, macOS minutes metering at 10x - so a build only starts when
    # something a build consumes changed. scripts/ is tooling that runs *on* the artifact, never to make it
    paths-ignore: ["**/*.md", "scripts/**"]
  pull_request:
    paths-ignore: ["**/*.md", "scripts/**"]

permissions:
  contents: read

jobs:
  # Builds the extension for the DuckDB distribution matrix with DuckDB's own CI images and uploads one
  # artifact per platform (<ext>-<duckdb-version>-extension-<arch>). The reusable workflow clones duckdb
  # into ./duckdb itself (the Makefile prefers that over the ../vendor checkout used locally), and the
  # root vcpkg.json satisfies the manifest its CI images point VCPKG_MANIFEST_DIR at.
  distribution:
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@4a5752ce7689b547344a91067bddb2b2b5395fac
    with:
      extension_name: hf
      # Pinned, exactly the tree vendored in ../vendor/extension-ci-tools
      ci_tools_version: 4a5752ce7689b547344a91067bddb2b2b5395fac
      # The version identifier baked into an extension has to equal the one the *client* reports, and
      # `duckdb_version` is the input that decides it: extension-ci-tools exports it as DUCKDB_VERSION into
      # the whole job, DuckDB's Makefile prefers DUCKDB_VERSION over OVERRIDE_GIT_DESCRIBE over
      # DUCKDB_EXPLICIT_VERSION, and append_extension_metadata.py writes the footer's duckdb_version field
      # from that same environment. Get it wrong and the run is green anyway - the first release run here
      # produced a full green matrix whose artifacts no client could load, and the proof was one line read
      # off the built artifact:
      #   The file was built specifically for DuckDB version 'd4355d01c593...' ... this version of
      #   DuckDB is 'vd4355d01c593...'
      #
      # For the eight releases up to 2.0.0 this input was not sufficient on its own, because the target was
      # v2.0.0-alpha47600: an identifier DuckDB's release CI *generates*, not a tag. `git ls-remote --tags
      # origin 'v2.0.0-alpha*'` on duckdb/duckdb returned nothing, so the clone could not check the version
      # out, and `git describe` fell back to the sha. The workaround was a one-commit mirror of the exact
      # upstream tree carrying the tag (https://github.com/lhoestq/duckdb, kept for the artifacts it built).
      # `duckdb_tag` stayed unset throughout: the phase runs `git tag` inside the clone and nothing reads the
      # result, because the environment override wins - which is how a six-line yaml comment becomes a build
      # failure.
      #
      # 2.0.0 is tagged upstream (d54cbbe3df17e8e5ce68312f483b4155836112aa, a lightweight tag), so both
      # workarounds retire here: extension-ci-tools' default clone of duckdb/duckdb can fetch and check out
      # `v2.0.0`, and that string is what the footer carries. The identifier is no less load-bearing for
      # being a real tag - a release built against the wrong one is still an artifact nobody can load, which
      # is what the selftest job below is for: it loads the artifact with the DuckDB the build shipped.
      #
      # A released version also unlocks what an alpha could not have. extension-ci-tools asks
      # https://duckdb-staging.duckdb.org/<short sha>/latest_alpha_version.txt for a prebuilt static-libs
      # archive and only builds DuckDB from source when that answers 404 - which it did for the old alpha's
      # commit, and does not for d54cbbe3df (it answers v2.0.0-alpha49307). So a 2.0.0 job downloads DuckDB
      # instead of compiling it. On a private repository that bills macOS minutes at 10x, that is the
      # difference worth noticing in a build log: "Using prebuilt DuckDB archive: ..." versus 7 minutes of
      # compiling before a single line of this extension is built.
      duckdb_version: v2.0.0
      # The matrix is shaped by the event, because GitHub bills macOS minutes at 10x against a monthly
      # quota in a private repository and every job here compiles DuckDB from source (the prebuilt DuckDB
      # archives only exist for released versions). A push therefore builds the three architectures that
      # are cheap and cover the everyday case; a `workflow_dispatch` builds everything DuckDB has a runner
      # for except wasm, which is the run that produces a release tree. wasm stays excluded either way:
      # this extension is a filesystem + HTTP client with a thread pool for uploads, and the shape of those
      # assumptions does not survive into a browser.
      #
      # The extra architectures are opt-ins in extension-ci-tools' own matrix
      # (config/distribution_matrix.json), so `opt_in_archs` is what turns them on - `exclude_archs` alone
      # would not be enough for the musl pair and osx_amd64, which a reduced matrix skips. And
      # `allow_failure_archs` keeps one experimental cross-compile from failing the run whose artifacts a
      # release is made of (a failed job uploads nothing, so its platform directory is simply absent).
      #
      # A conditional suffix has to be ONE comparison: GitHub binds `&&` tighter than `||`, so
      # `a || b && ';list' || ''` parses as `(a || (b && ';list')) || ''`, short-circuits on `a`, and
      # returns the boolean `true`, which then pastes itself onto the end of the string. The shape that
      # looks natural - naming two events - is the broken one, hence `!= 'workflow_dispatch'` here rather
      # than `== 'push' || == 'pull_request'`. `exclude_archs: …;wasm_threadstrue` in a build log is what a
      # poisoned suffix looks like: `wasm_threads` stops matching, everything the suffix named stops being
      # excluded, and the run is green anyway.
      exclude_archs: "windows_arm64;wasm_mvp;wasm_eh;wasm_threads${{ github.event_name != 'workflow_dispatch' && ';linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64' || '' }}"
      # opt_in_archs is conditional for the same billing reason, and because a run that builds all eight is
      # a release run rather than a push. `reduced_ci_mode` below is set by the same test: on a dispatch it
      # switches off fail-fast, which the first pre7 release run used to cancel two healthy builds
      # (osx_amd64, windows_amd64_mingw) after an unrelated architecture failed to compile. Whether the run
      # is green is allow_failure_archs' job, not fail-fast's. (This line existed only as a comment for four
      # releases: the input was never forwarded, so the dispatch that produced pre7 still ran with fail-fast
      # on. A workflow comment describing an input nobody passes is a wish, not a configuration.)
      opt_in_archs: ${{ github.event_name == 'workflow_dispatch' && 'linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_amd64' || '' }}
      reduced_ci_mode: ${{ github.event_name == 'workflow_dispatch' && 'disabled' || 'auto' }}
      allow_failure_archs: "linux_amd64_musl;linux_arm64_musl;windows_amd64"
      skip_tests: false

  # The matrix does run a test step, but it cannot run test/sql/hf_selftest.test: that file starts with
  # `require hf`, and DuckDB only autoloads extensions on its own compiled-in AUTOLOADABLE_EXTENSIONS
  # list, which a third-party name can never join - so the runner reports "require hf: 1" and skips the
  # file, and a skipped file reports success. This job runs the same reference checks for real, through
  # the plain shell, against the artifact another job built (a build artifact carries a matching duckdb
  # binary + libduckdb in test-support.tar.gz precisely so tests can be run against it elsewhere). The
  # bytes verified here are therefore the bytes a client downloads.
  selftest:
    name: reference checks on the built artifact (linux_amd64)
    needs: distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hf-*-extension-linux_amd64
          path: artifact
          merge-multiple: true
      - name: unpack the duckdb binary the build shipped with
        run: |
          set -euo pipefail
          support=$(find artifact -name test-support.tar.gz | head -1)
          if [[ -z "$support" ]]; then
            echo "::error::the artifact carries no test-support.tar.gz - it is only produced when the matrix builds with tests enabled"
            find artifact -type f | head -40
            exit 1
          fi
          mkdir -p build && tar -xzf "$support" -C build
          ext=$(find artifact -name hf.duckdb_extension | head -1)
          if [[ -z "$ext" ]]; then echo "::error::no hf.duckdb_extension in the artifact"; find artifact -type f | head -40; exit 1; fi
          echo "EXT=$ext" >> "$GITHUB_ENV"
          echo "DuckDB binary to test with:" && ./build/release/duckdb --version || true
      - name: load it and run every offline check
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build/release/src${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          DUCKDB=./build/release/duckdb bash scripts/ci_selftest.sh "$EXT"
