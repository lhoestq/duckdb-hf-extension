name: Build extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

jobs:
  # Builds the extension for the DuckDB distribution matrix with DuckDB's own CI images and uploads
  # one artifact per platform (<ext>-<duckdb-version>-extension-<arch>). The reusable workflow checks
  # duckdb out next to this repo (./duckdb), which the Makefile prefers over ../vendor as well.
  #
  # NOTE: not yet executed on GitHub - the matrix, and in particular alpha/dev DuckDB builds, still
  # needs a first green run.
  distribution:
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@4a5752ce7689b547344a91067bddb2b2b5395fac
    with:
      extension_name: hf
      # Pinned, exactly the tree vendored in ../vendor/extension-ci-tools
      ci_tools_version: 4a5752ce7689b547344a91067bddb2b2b5395fac
      # Pin the duckdb commit the extension is compiled against. For a *released* DuckDB use its tag
      # (v2.0.0, ...) instead: the version identifier baked into the binary must equal the one of the
      # duckdb that will load the extension, and dev wheels carry a generated v2.0.0-alphaNNNNN that
      # no upstream tag provides (see README "The version identifier has to match").
      duckdb_version: d4355d01c59362d57036ad377735dd5340276a5b
      # windows and wasm are not exercised locally, musl needs an extra toolchain
      exclude_archs: "windows_amd64;windows_arm64;linux_amd64_musl;linux_arm64_musl;wasm_mvp;wasm_eh;wasm_threads"
      skip_tests: false
